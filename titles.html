<!DOCTYPE html>

    <link rel="stylesheet" href="style.css?v=9">
    <script>try{if(localStorage.getItem('nenlymine-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>

<body>
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-block"></span>
                <span class="logo-text">NenlyMine</span>
            </a>
        <nav class="nav" id="siteNav">
                <a href="index.html">Главная</a>
                <a href="privileges.html">Привилегии</a>
                <a href="unban.html">Разбан</a>
                <a href="unmute.html">Размут</a>
                <a href="titles.html" class="active">Теги</a>
                <a href="rules.html">Правила</a>
                <a href="faq.html">FAQ</a>
                <a href="cart.html" class="cart-link">Корзина<span id="cartBadge" class="cart-count" style="display:none"></span></a>
            </nav>
            <button class="hamburger" id="menuToggle" type="button" aria-label="Открыть меню" aria-expanded="false">
                <svg class="icon-burger" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
                <svg class="icon-close" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
        </div>

    <main>
        <section class="page-hero">
            <div class="container">

                <p class="page-hero-sub">Получи яркий цветной тег к своему нику в чате.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="grid grid-whole">
                    <div class="card card-give" data-kind="tag" data-label="Цветной тег" data-price="0">
                        <div class="thumb" style="background:linear-gradient(135deg,#FF8000,#FFD34D)">#</div>
                        <h3 class="card-title">Цветной тег</h3>
                        <p class="card-desc">Уникальный цветной тег возле ника. Выдаётся всем, кто его приобрёл — достаточно сообщить ник игрока.</p>
                        <button type="button" class="btn btn-buy btn-add-cart" data-kind="tag" data-label="Цветной тег" data-price="0">В корзину</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 <span class="footer-brand">NenlyMine</span>. Не связан с Mojang AB.</p>
        </div>
